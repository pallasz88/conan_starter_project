name: Multplatform CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-gcc-release
            conan_compiler: gcc
            compiler_version: 13
            compiler_cppstd: gnu17
            compiler_libcxx: libstdc++11
            build_type: Release
            config_flag: ""

          - os: ubuntu-latest
            preset: linux-clang-release
            conan_compiler: clang
            compiler_version: 17
            compiler_cppstd: gnu17
            compiler_libcxx: libstdc++11
            build_type: Release
            config_flag: ""

          - os: windows-latest
            preset: windows-msvc-release
            conan_compiler: msvc
            compiler_version: 195
            compiler_cppstd: 14
            compiler_libcxx: ""
            build_type: Release
            config_flag: "-C Release"

          - os: macos-latest
            preset: macos-clang-release
            conan_compiler: apple-clang
            compiler_version: 17
            compiler_cppstd: gnu17
            compiler_libcxx: libc++
            build_type: Release
            config_flag: ""
          
          - os: ubuntu-latest
            preset: linux-gcc-debug
            conan_compiler: gcc
            compiler_version: 13
            compiler_cppstd: gnu17
            compiler_libcxx: libstdc++11
            build_type: Debug
            config_flag: ""
          
          - os: ubuntu-latest
            preset: linux-clang-debug
            conan_compiler: clang
            compiler_version: 17
            compiler_cppstd: gnu17
            compiler_libcxx: libstdc++11
            build_type: Debug
            config_flag: ""
          
          - os: windows-latest
            preset: windows-msvc-debug
            conan_compiler: msvc
            compiler_version: 195
            compiler_cppstd: 14
            compiler_libcxx: ""
            build_type: Debug
            config_flag: "-C Debug"
          
          - os: macos-latest
            preset: macos-clang-debug
            conan_compiler: apple-clang
            compiler_version: 17
            compiler_cppstd: gnu17
            compiler_libcxx: libc++
            build_type: Debug
            config_flag: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Conan
        # uses: conan-io/setup-conan@v2 is not yet available for Conan 2.x
        run: |
          python -m pip install --upgrade pip
          pip install "conan>=2.0"

      - name: Conan Install
        shell: bash
        run: |
          conan profile detect --force
          conan install . \
            --output-folder=build \
            --build=missing \
            -s compiler=${{ matrix.conan_compiler }} \
            -s compiler.version=${{ matrix.compiler_version }} \
            -s compiler.cppstd=${{ matrix.compiler_cppstd }} \
            -s compiler.libcxx=${{ matrix.compiler_libcxx }} \
            -s build_type=${{ matrix.build_type }}

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure ${{ matrix.config_flag }}
