name: Multplatform CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    env:
      CONAN_ARGS: >
        --output-folder=build
        --build=missing
        -s compiler=${{ matrix.conan_compiler }}
        -s compiler.version=${{ matrix.compiler_version }}
        -s compiler.cppstd=${{ matrix.compiler_cppstd }}
        ${{ matrix.compiler_libcxx && format('-s compiler.libcxx={0}', matrix.compiler_libcxx) || '' }}
        ${{ matrix.compiler_runtime && format('-s compiler.runtime={0}', matrix.compiler_runtime) || '' }}
        -s build_type=${{ matrix.build_type }}
        --profile:build ${{ github.workspace }}/conan/profiles/${{ matrix.profile }}
        --profile:host ${{ github.workspace }}/conan/profiles/${{ matrix.profile }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-gcc-release
            conan_compiler: gcc
            compiler_version: 13
            compiler_cppstd: gnu17
            compiler_libcxx: libstdc++11
            build_type: Release
            config_flag: ""
            profile: linux-gcc-release

          - os: ubuntu-latest
            preset: linux-clang-release
            conan_compiler: clang
            compiler_version: 17
            compiler_cppstd: gnu17
            compiler_libcxx: libstdc++11
            build_type: Release
            config_flag: ""
            profile: linux-clang-release

          - os: windows-latest
            preset: windows-msvc-release
            conan_compiler: msvc
            compiler_version: 194
            compiler_cppstd: 17
            compiler_runtime: dynamic
            build_type: Release
            config_flag: "-C Release"
            profile: windows-msvc-release

          - os: macos-latest
            preset: macos-clang-release
            conan_compiler: apple-clang
            compiler_version: 17
            compiler_cppstd: gnu17
            compiler_libcxx: libc++
            build_type: Release
            config_flag: ""
            profile: macos-clang-release
          
          - os: ubuntu-latest
            preset: linux-gcc-debug
            conan_compiler: gcc
            compiler_version: 13
            compiler_cppstd: gnu17
            compiler_libcxx: libstdc++11
            build_type: Debug
            config_flag: ""
            profile: linux-gcc-debug
          
          - os: ubuntu-latest
            preset: linux-clang-debug
            conan_compiler: clang
            compiler_version: 17
            compiler_cppstd: gnu17
            compiler_libcxx: libstdc++11
            build_type: Debug
            config_flag: ""
            profile: linux-clang-debug
          
          - os: windows-latest
            preset: windows-msvc-debug
            conan_compiler: msvc
            compiler_version: 194
            compiler_cppstd: 17
            compiler_runtime: dynamic
            build_type: Debug
            config_flag: "-C Debug"
            profile: windows-msvc-debug
          
          - os: macos-latest
            preset: macos-clang-debug
            conan_compiler: apple-clang
            compiler_version: 17
            compiler_cppstd: gnu17
            compiler_libcxx: libc++
            build_type: Debug
            config_flag: ""
            profile: macos-clang-debug

    steps:
      - uses: actions/checkout@v4

      - name: Select compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.conan_compiler }}" = "clang" ]; then
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          else
            echo "CC=gcc-${{ matrix.compiler_version }}" >> $GITHUB_ENV
            echo "CXX=g++-${{ matrix.compiler_version }}" >> $GITHUB_ENV
          fi


      - name: Install Conan
        # uses: conan-io/setup-conan@v2 is not yet available for Conan 2.x
        run: |
          python -m pip install --upgrade pip
          pip install "conan>=2.0"

      - name: Conan Install
        run: >
          conan install . ${{ env.CONAN_ARGS }}

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure ${{ matrix.config_flag }}
